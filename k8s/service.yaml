# =============================================================================
# Service — Instrucciones.html: Paso 4
# =============================================================================
# ClusterIP interno. Expone el puerto 80 y redirige al targetPort 3000 del pod.
# Selector: app=inventario-app (matchea tanto pods estables como canary).
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: inventario-app
  namespace: inventario-app
  labels:
    app: inventario-app
spec:
  selector:
    app: inventario-app
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
  type: ClusterIP
