apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventario-app
  namespace: inventario-app
  labels:
    app: inventario-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventario-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: inventario-app
    spec:
      containers:
      - name: inventario-app
        image: ghcr.io/nnyez/inventario-app:latest
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: inventario-app-config
        env:
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: inventario-app-secrets
              key: API_KEY
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
