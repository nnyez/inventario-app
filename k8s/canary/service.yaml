# =============================================================================
# Service canary — Instrucciones.html: Paso 6-8
# =============================================================================
# Mismo nombre que k8s/service.yaml, ambos se llaman "inventario-app".
# Selector: app=inventario-app (sin track), por lo que matchea tanto pods
#   estables como canary. El tráfico se distribuye proporcional a la cantidad
#   de pods: 4 estables + 1 canary = ~80/20.
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: inventario-app
  namespace: inventario-app
  labels:
    app: inventario-app
spec:
  selector:
    app: inventario-app
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
  type: ClusterIP
