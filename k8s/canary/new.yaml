# =============================================================================
# Canary — Deployment nuevo (20% tráfico) — Instrucciones.html: Paso 6-8
# =============================================================================
# 1 réplica de la nueva versión (v2/green).
# APP_VERSION=v2 y APP_COLOR=green se inyectan directo, sobreescribiendo
#   los valores del ConfigMap.
# Como solo hay 1 réplica canary vs 4 estables, el Service envía ~20% del
#   tráfico a este pod (ver README Paso 6.2).
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventario-app-canary
  namespace: inventario-app
  labels:
    app: inventario-app
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventario-app
      track: canary
  template:
    metadata:
      labels:
        app: inventario-app
        track: canary
    spec:
      containers:
      - name: inventario-app
        image: ghcr.io/nnyez/inventario-app:latest
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: inventario-app-config
        env:
        - name: APP_VERSION
          value: "v2"
        - name: APP_COLOR
          value: "green"
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
