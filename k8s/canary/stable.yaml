apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventario-app-stable
  labels:
    app: inventario-app
    track: stable
spec:
  replicas: 4
  selector:
    matchLabels:
      app: inventario-app
      track: stable
  template:
    metadata:
      labels:
        app: inventario-app
        track: stable
    spec:
      containers:
      - name: inventario-app
        image: ghcr.io/TU_USUARIO/inventario-app:latest
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: inventario-app-config
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
