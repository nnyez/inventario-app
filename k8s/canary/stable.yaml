# =============================================================================
# Canary — Deployment estable (80% tráfico) — Instrucciones.html: Paso 6-8
# =============================================================================
# 4 réplicas de la versión actual (v1/blue).
# Etiqueta "track: stable" para identificar este grupo.
# El Service (k8s/canary/service.yaml) selecciona por app=inventario-app,
#   por lo que balancea entre estables y canary según cantidad de pods.
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventario-app-stable
  namespace: inventario-app
  labels:
    app: inventario-app
    track: stable
spec:
  replicas: 4
  selector:
    matchLabels:
      app: inventario-app
      track: stable
  template:
    metadata:
      labels:
        app: inventario-app
        track: stable
    spec:
      containers:
      - name: inventario-app
        image: ghcr.io/nnyez/inventario-app:latest
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: inventario-app-config
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
